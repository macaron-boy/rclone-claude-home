<p>rclone-claude-home は、所有者本人が自分の Google ドライブに自分のサーバーからアクセスするためだけに使う OAuth クライアントです。</p>
<ul>
<li>第三者の利用者はいません。本人以外のデータにアクセスしません。</li>
<li>取得したデータは本人のサーバーの中だけで扱い、外部に送ったり第三者に提供したりしません。</li>
<li>アクセスの許可は、Google アカウントの設定からいつでも取り消せます。</li>
</ul>
